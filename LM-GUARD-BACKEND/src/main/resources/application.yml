# =====================================================================
# LM-GUARD - base configuration (shared by all profiles)
# Every secret is read from the environment. Nothing is hardcoded here.
# =====================================================================
spring:
  application:
    name: lm-guard-backend

  # Auto-loads .env from the working directory as if it were a .properties file, so
  # `./mvnw spring-boot:run` picks up secrets without a shell-specific `source .env`
  # step (which doesn't exist on Windows cmd/PowerShell). Optional: absent in
  # production, where Render/the host injects real environment variables instead.
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      pool-name: lmguard-pool

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate never modifies it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:15MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# ---------------------------------------------------------------------
# Swagger / OpenAPI  ->  http://localhost:8080/swagger-ui/index.html
# ---------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

# ---------------------------------------------------------------------
# LM-GUARD application settings
# ---------------------------------------------------------------------
lmguard:
  base-url: ${APP_BASE_URL:http://localhost:8080}

  cors:
    # Comma-separated list. Never "*" in production.
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  jwt:
    # Base64-encoded key, >= 256 bits.  openssl rand -base64 48
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: ${JWT_ISSUER:lm-guard}

  security:
    # Creates exactly one ADMIN account from env vars on startup - the production path for
    # bootstrapping the first administrator, since POST /auth/register can never create one
    # (see AuthService#register) and DemoUserSeeder is dev/demo-only. Off by default; even if
    # left on, it refuses to run once any administrator already exists. Unused in dev, where
    # DemoUserSeeder already provides admin@lmguard.gov.in.
    bootstrap-admin-enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-admin-name: ${BOOTSTRAP_ADMIN_NAME:Administrator}

  ai:
    # When true the pipeline runs end-to-end with MockAIAnalysisService.
    mock-mode: ${AI_MOCK_MODE:true}
    # When true a failure of the real AI service degrades to the mock
    # instead of failing the inspection (keeps live demos alive).
    fallback-to-mock: ${AI_FALLBACK_TO_MOCK:true}
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    analyze-path: ${AI_SERVICE_ANALYZE_PATH:/analyze}
    api-key: ${AI_SERVICE_API_KEY:}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:30000}

  storage:
    # supabase | local
    provider: ${STORAGE_PROVIDER:local}
    local-directory: ${STORAGE_LOCAL_DIR:./storage-data}
    buckets:
      package-images: ${STORAGE_BUCKET_PACKAGE_IMAGES:package-images}
      evidence: ${STORAGE_BUCKET_EVIDENCE:evidence}
      reports: ${STORAGE_BUCKET_REPORTS:reports}

  supabase:
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

  rules:
    # Ruleset version recorded on every inspection. Defaults to the rules derived from the
    # actual Legal Metrology (Packaged Commodities) Rules, 2011 (see legal-rules/). Set to
    # DEMO-2026.1 (with RULES_SAMPLE_FILE=classpath:rules/sample-rules.json) to use the
    # illustrative demo ruleset instead.
    active-version: ${RULES_ACTIVE_VERSION:LM-PC-2011-v1}
    sample-file: ${RULES_SAMPLE_FILE:classpath:rules/lm-pc-2011-rules.json}
    # Seed the active ruleset into the `rules` table on first start.
    seed-demo-rules: ${RULES_SEED_DEMO:true}
    # A field detected below this confidence is INCONCLUSIVE, never NON_COMPLIANT.
    default-min-confidence: ${RULES_MIN_CONFIDENCE:0.70}

  demo:
    # Seeds the 5 Legal Metrology zones the admin console's selectors expect.
    seed-demo-zones: ${DEMO_SEED_ZONES:true}
    # Seeds 1 admin + 11 inspector accounts matching the admin console's original
    # mock directory, so the console shows the same roster on first run against a
    # real backend. Generated passwords are logged once at startup, except the two
    # accounts the login screens advertise (admin@lmguard.gov.in / S. Kumar).
    seed-demo-accounts: ${DEMO_SEED_ACCOUNTS:true}

  risk:
    weights:
      previous-violations: ${RISK_W_PREVIOUS_VIOLATIONS:30}
      product-changes: ${RISK_W_PRODUCT_CHANGES:20}
      online-mismatch: ${RISK_W_ONLINE_MISMATCH:25}
      category-risk: ${RISK_W_CATEGORY:10}
      repeat-issue: ${RISK_W_REPEAT_ISSUE:15}
    thresholds:
      # 0..low = LOW, low+1..medium = MEDIUM, above = HIGH
      low-max: ${RISK_LOW_MAX:30}
      medium-max: ${RISK_MEDIUM_MAX:60}
    max-score: 100
    # Categories that carry an inherent compliance risk uplift.
    high-risk-categories: >-
      FOOD,PACKAGED_FOOD,EDIBLE_OIL,INFANT_FOOD,DAIRY,MEDICINE,COSMETICS

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.lmguard: ${LOG_LEVEL_APP:DEBUG}
