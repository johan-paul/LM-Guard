org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# This machine's JDKs can't open a loopback AF_UNIX socket (same root cause as the Tomcat
# NIO connector fix in the backend) - the Gradle daemon's client/daemon IPC needs exactly
# that, failing every build with "Unable to establish loopback connection". Running without
# a daemon avoids that IPC entirely; disabling the watch-fs service (also socket-based) too.
org.gradle.daemon=false
org.gradle.vfs.watch=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
